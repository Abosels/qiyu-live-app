services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${QIYU_MYSQL_PASSWORD}
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    ports:
      - "3307:3306"
    volumes:
      - ./master/data:/var/lib/mysql

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${QIYU_MYSQL_PASSWORD}
    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
    ports:
      - "3308:3306"
    volumes:
      - ./slave/data:/var/lib/mysql
    depends_on:
      - mysql-master
