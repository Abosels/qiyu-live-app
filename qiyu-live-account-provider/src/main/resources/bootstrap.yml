server:
  port: 8083

spring:
  application:
    name: qiyu-live-account-provider
  config:
    import:
      - "optional:nacos:qiyu-live-account-provider.yml"
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      discovery:
        # Nacos 服务发现地址
        server-addr: host.docker.internal:8848
        # 使用 public 命名空间
        namespace: public
        group: DEFAULT_GROUP
      config:
        import-check:
          enabled: false
        # Nacos 配置中心地址
        server-addr: host.docker.internal:8848
        # 配置文件后缀
        file-extension: yml
        # 使用 public 命名空间
        namespace: public
        group: DEFAULT_GROUP

dubbo:
  application:
    name: ${spring.application.name}
  registry:
    # Dubbo 注册到 Nacos
    address: nacos://host.docker.internal:8848
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
    parameters:
      namespace: public
  protocol:
    name: dubbo
    port: 9090
  server:
    true