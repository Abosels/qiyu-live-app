# Nacos 配置：qiyu-live-api
# DataId: qiyu-live-api.yml
# Group: DEFAULT_GROUP
# Namespace: public
#
# 上传方式：Nacos 控制台 → 配置管理 → 配置列表 → 新增配置
# 说明：API 层不需要数据源配置，仅需 Redis 缓存和 RocketMQ 配置

spring:
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: 1000ms

qiyu:
  pay:
    # 浏览器访问支付宝收银台前，先由 bank-api 生成签名表单。
    bank-api-base-url: http://localhost:8093

# RocketMQ 已移至 bootstrap.yml 中通过 qiyu.rmq 前缀兜底配置，
# 如需通过 Nacos 动态下发，可在此处补充对应配置。
