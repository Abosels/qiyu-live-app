# Nacos 配置：qiyu-live-gift-provider
# DataId: qiyu-live-gift-provider.yml
# Group: DEFAULT_GROUP
# Namespace: public
#
# 上传方式：Nacos 控制台 → 配置管理 → 配置列表 → 新增配置

spring:
  datasource:
    # 容器访问宿主机数据库时，库名必须与 MySQL 中的 qiyu_live_gift 一致。
    url: jdbc:mysql://host.docker.internal:3306/qiyu_live_gift?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${QIYU_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: 1000ms

qiyu:
  rmq:
    producer:
      # 属性名需映射到 RocketMQProducerProperties.nameSrv，不能写成 nameServer。
      name-srv: host.docker.internal:9876
      group-name: qiyu-live-gift-provider-producer
      retry-times: 3
      send-msg-timeout: 3000
    consumer:
      # 红包领取、送礼和库存回滚消费者共用该 NameServer。
      name-srv: host.docker.internal:9876
      group-name: qiyu-live-gift-provider
