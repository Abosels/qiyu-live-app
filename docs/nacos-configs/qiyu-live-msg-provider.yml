# Nacos 配置：qiyu-live-msg-provider
# DataId: qiyu-live-msg-provider.yml
# Group: DEFAULT_GROUP
# Namespace: public
#
# 上传方式：Nacos 控制台 → 配置管理 → 配置列表 → 新增配置
# 说明：消息持久化服务，使用 MySQL + ShardingSphere 分片，
# MongoDB 存储 IM 消息体，Redis 做缓存

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3307/qiyu_live_msg?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${QIYU_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: 1000ms
