# Nacos 配置：qiyu-live-account-provider
# DataId: qiyu-live-account-provider.yml
# Group: DEFAULT_GROUP
# Namespace: public
#
# 上传方式：Nacos 控制台 → 配置管理 → 配置列表 → 新增配置
# 说明：账户 Token 服务，以 Redis 为核心存储，无需 MySQL。
# 若后续接入 MySQL 来持久化 Token 记录，再补充 datasource 段。

spring:
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: 1000ms
