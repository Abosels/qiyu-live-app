# Nacos 配置：qiyu-live-user-provider
# DataId: qiyu-live-user-provider.yml
# Group: DEFAULT_GROUP
# Namespace: public
#
# 上传方式：Nacos 控制台 → 配置管理 → 配置列表 → 新增配置
# 说明：用户服务，使用 MySQL 持久化 + MongoDB 存储用户标签，Redis 做缓存

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/qiyu_live_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${QIYU_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: 1000ms
    # MongoDB 配置已在 bootstrap.yml 中以 uri 方式配置，此处不需要重复
