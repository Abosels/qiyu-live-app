# Nacos 配置：qiyu-live-user-msg (对应 qiyu-live-user-interface 模块)
# DataId: qiyu-live-user-msg.yml
# Group: DEFAULT_GROUP
# Namespace: public
#
# 上传方式：Nacos 控制台 → 配置管理 → 配置列表 → 新增配置
# 注意：此模块 spring.application.name 为 qiyu-live-user-msg，
# 与目录名 qiyu-live-user-interface 不一致，疑似废弃/错放模块。
# 若确认废弃，此配置可移除。

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/qiyu_live_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${QIYU_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 5
          max-idle: 10
          max-active: 20
          max-wait: 1000ms
    # MongoDB 配置已在 bootstrap.yml 中以 uri 方式配置
