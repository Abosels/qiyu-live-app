spring:
  application:
    name: qiyu-live-im-provider
  config:
    import:
      - "optional:classpath:qiyu-live-im-provider.yaml"
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${QIYU_NACOS_ADDR:127.0.0.1:8848}
        namespace: public
        group: DEFAULT_GROUP
      config:
        import-check:
          enabled: false
        server-addr: ${QIYU_NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP

server:
  port: 8085

dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://${QIYU_NACOS_ADDR:127.0.0.1:8848}?namespace=public
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:}
  protocol:
    name: dubbo
    port: 9094
  server: true
