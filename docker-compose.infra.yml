# 基础设施 Compose（Infra）：仅包含 MongoDB。
#
# 说明：
#   1. Nacos 保留宿主机（Windows 本机服务，端口 8848），不在此容器化。
#   2. Redis / MySQL / RocketMQ / SRS 复用现有旧容器，已接入 qiyu-live-network。
#   3. 真实敏感值（密码）放在 .env.docker，本文件只引用变量，不写真实值。

# 显式指定项目名，避免与旧根 docker-compose.yml（项目名 qiyu-live-app）冲突
name: qiyu-live-infra

services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:7.0}   # 固定版本，禁止 latest
    container_name: qiyu-live-mongodb
    restart: unless-stopped
    environment:
      # root 账号密码来自 .env.docker，此处仅引用变量
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    volumes:
      - qiyu-live-mongodb-data:/data/db   # 命名卷持久化数据
    networks:
      - qiyu-live-network                 # 加入外部共享网络，服务别名自动为 mongodb
    healthcheck:
      # 用 root 凭据执行 ping，成功则退出码 0
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 默认不映射宿主机端口（本机 Windows MongoDB 已占用 27017）。
    # 需要 Navicat / IDEA 调试时，在 .env.docker 里设置 MONGODB_HOST_PORT=27018，
    # 并取消下面两行注释。
    # ports:
    #   - "${MONGODB_HOST_PORT:-27018}:27017"

volumes:
  qiyu-live-mongodb-data:                 # MongoDB 数据命名卷

networks:
  qiyu-live-network:
    external: true                        # 复用已创建的外部网络，不让 Compose 自动新建
