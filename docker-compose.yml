services:
  qiyu-live-id-generate-provider:
    # ID 生成服务：MySQL + Dubbo + Nacos
    build:
      context: qiyu-live-id-generate-provider
      dockerfile: docker/Dockerfile
    image: qiyu-live-id-generate-provider:1.0-SNAPSHOT
    ports:
      - "9094:9090"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/qiyu_live_common?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${QIYU_MYSQL_PASSWORD}
      DUBBO_REGISTRY_ADDRESS: nacos://host.docker.internal:8848?namespace=public&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:}
      DUBBO_PROTOCOL_PORT: 9090
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qiyu-live-user-provider:
    # 用户服务：Mongo + MySQL 分库分表 + Redis + RocketMQ + Dubbo
    build:
      # 直接以模块根目录作为构建上下文，Dockerfile 会从 target 里取可执行 jar
      context: qiyu-live-user-provider
      dockerfile: docker/Dockerfile
    image: qiyu-live-user-provider:1.0-SNAPSHOT
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://host.docker.internal:27017/qiyu-live-user
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      QIYU_MYSQL_MASTER_HOST: host.docker.internal
      QIYU_MYSQL_MASTER_PORT: 3306
      QIYU_MYSQL_SLAVE_HOST: host.docker.internal
      QIYU_MYSQL_SLAVE_PORT: 3306
      QIYU_MYSQL_USERNAME: root
      QIYU_MYSQL_PASSWORD: ${QIYU_MYSQL_PASSWORD}
      QIYU_RMQ_PRODUCER_NAMESERVER: host.docker.internal:9876
      QIYU_RMQ_CONSUMER_NAMESERVER: host.docker.internal:9876
      DUBBO_REGISTRY_ADDRESS: nacos://host.docker.internal:8848?namespace=public&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:}
      SERVER_PORT: 8082
      DUBBO_PROTOCOL_PORT: 9090
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qiyu-live-api:
    # API 服务：HTTP 入口 + Dubbo 消费者
    build:
      context: qiyu-live-api
      dockerfile: docker/Dockerfile
    image: qiyu-live-api:1.0-SNAPSHOT
    ports:
      - "8081:8081"
      - "9091:9090"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      DUBBO_REGISTRY_ADDRESS: nacos://host.docker.internal:8848?namespace=public&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:}
      SERVER_PORT: 8081
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qiyu-live-gateway:
    # 网关服务：统一外部入口
    build:
      context: qiyu-live-gateway
      dockerfile: docker/Dockerfile
    image: qiyu-live-gateway:1.0-SNAPSHOT
    ports:
      - "80:80"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      DUBBO_REGISTRY_ADDRESS: nacos://host.docker.internal:8848?namespace=public&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:}
      SERVER_PORT: 80
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qiyu-live-account-provider:
    # 账号服务：Redis + Dubbo + Nacos
    build:
      context: qiyu-live-account-provider
      dockerfile: docker/Dockerfile
    image: qiyu-live-account-provider:1.0-SNAPSHOT
    ports:
      - "9092:9090"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      DUBBO_REGISTRY_ADDRESS: nacos://host.docker.internal:8848?namespace=public&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:}
      DUBBO_PROTOCOL_PORT: 9090
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qiyu-live-msg-provider:
    # 短信服务：MySQL + Redis + Dubbo + Nacos
    build:
      context: qiyu-live-msg-provider
      dockerfile: docker/Dockerfile
    image: qiyu-live-msg-provider:1.0-SNAPSHOT
    ports:
      - "8084:8084"
      - "9093:9090"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: host.docker.internal:8848
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD}
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      QIYU_MYSQL_MASTER_HOST: host.docker.internal
      QIYU_MYSQL_MASTER_PORT: 3306
      QIYU_MYSQL_SLAVE_HOST: host.docker.internal
      QIYU_MYSQL_SLAVE_PORT: 3306
      QIYU_MYSQL_USERNAME: root
      QIYU_MYSQL_PASSWORD: ${QIYU_MYSQL_PASSWORD}
      DUBBO_REGISTRY_ADDRESS: nacos://host.docker.internal:8848?namespace=public&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:}
      SERVER_PORT: 8084
      DUBBO_PROTOCOL_PORT: 9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
